name: CI / CD Quality & Security Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      TESTING: "true"
      SECRET_KEY: ci-cd-testing-dummy-secret-key-minimum-32-chars-long
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Test Suite
        run: |
          python -m pytest -v --tb=short

  frontend-qa:
    name: Frontend Linting, Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
